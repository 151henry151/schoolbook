# Include in the nginx http context (conf.d is normally included here).
map $http_origin $schoolbook_bad_origin {
    default 1;
    "" 0;
    "https://romptele.com" 0;
    "https://www.romptele.com" 0;
}
limit_req_zone $binary_remote_addr zone=schoolbook_api:1m rate=10r/s;
