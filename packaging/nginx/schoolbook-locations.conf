# Include inside romptele.com's HTTPS server block only.
location = /schoolbook { return 301 /schoolbook/; }
location = /schoolbook/api { return 404; }
location ^~ /schoolbook/api/ {
    if ($schoolbook_bad_origin) { return 403; }
    limit_req zone=schoolbook_api burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 10m;
    proxy_pass http://127.0.0.1:28766/api/;
    proxy_set_header Host 127.0.0.1:8766;
    # The daemon remains loopback-only, even with uvicorn proxy headers enabled.
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Forwarded "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_cookie_path / /schoolbook/;
    proxy_cookie_flags schoolbook_session secure httponly samesite=strict;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
}
location ^~ /schoolbook/ {
    alias /var/www/schoolbook-console/;
    index index.html;
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}
