name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check protocol daemon session
      - run: uv run mypy --strict protocol/src daemon/src session/src
      - run: uv run pytest --override-ini='addopts='
      - run: uv run reuse lint

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: npm ci
        working-directory: console
      - run: npm test
        working-directory: console
      - run: npm run build
        working-directory: console

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci && npm run build
        working-directory: ui
      - run: npm ci && npm run build
        working-directory: console
      - run: npm ci
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
