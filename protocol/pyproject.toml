[project]
name = "schoolbook-protocol"
version = "1.0.0"
description = "Shared Schoolbook message models"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["pydantic>=2.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schoolbook_protocol"]
