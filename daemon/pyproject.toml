[project]
name = "schoolbookd"
version = "0.9.0"
description = "Schoolbook tutor daemon"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
  "schoolbook-protocol",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "pydantic>=2.10",
  "pyyaml>=6.0",
  "argon2-cffi>=23.1",
  "httpx>=0.28",
  "python-multipart>=0.0.17",
  "websockets>=14",
]

[project.scripts]
schoolbookd = "schoolbookd.__main__:main"
schoolbook = "schoolbookd.launch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schoolbookd"]

[tool.uv.sources]
schoolbook-protocol = { workspace = true }
