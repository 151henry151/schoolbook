[project]
name = "schoolbook-session"
version = "0.9.0"
description = "Schoolbook kiosk session agent"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["schoolbook-protocol", "pydantic>=2.10"]

[project.scripts]
schoolbook-session = "schoolbook_session.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schoolbook_session"]

[tool.uv.sources]
schoolbook-protocol = { workspace = true }
